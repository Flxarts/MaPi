<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F2F7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MaPi">
<title>MaPi</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/*__CSS__*/
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>

<main id="gate" class="gate">
  <form id="gate-form" class="gate-card" autocomplete="off" novalidate>
    <div class="gate-logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="64" height="64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B9EEDB"/><stop offset="1" stop-color="#3F8571"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#lg)"/><g fill="#fff"><path d="M20.5 47.5 43 18" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none"/><ellipse cx="25.5" cy="29.5" rx="6.6" ry="5.2" transform="rotate(-18 25.5 29.5)" opacity=".95"/><ellipse cx="38.5" cy="36.5" rx="6.6" ry="5.2" transform="rotate(28 38.5 36.5)" opacity=".8"/><ellipse cx="33" cy="20" rx="5.2" ry="4.1" transform="rotate(-24 33 20)" opacity=".85"/><ellipse cx="45.5" cy="25.5" rx="5.2" ry="4.1" transform="rotate(34 45.5 25.5)" opacity=".7"/><ellipse cx="18.5" cy="40" rx="5.4" ry="4.2" transform="rotate(-10 18.5 40)" opacity=".75"/></g></svg>
    </div>
    <h1 class="gate-title">MaPi</h1>
    <p class="gate-sub">Malin Public Health</p>
    <label class="field gate-field" for="gate-pw">
      <span class="sr">Passwort</span>
      <input id="gate-pw" type="password" placeholder="Passwort" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    </label>
    <p id="gate-msg" class="gate-msg" role="alert" aria-live="polite"></p>
    <button id="gate-btn" class="btn primary block" type="submit"><span class="btn-label">Entsperren</span><span class="spinner" aria-hidden="true"></span></button>
    <label class="switch-row" for="gate-keep">
      <span>Auf diesem Gerät angemeldet bleiben</span>
      <input id="gate-keep" type="checkbox" class="switch" checked>
    </label>
    <p class="gate-foot">Private Lernumgebung. Die Inhalte sind verschlüsselt und werden erst mit dem Passwort lesbar.</p>
  </form>
</main>

<div id="app" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script id="vault" type="application/json">__VAULT__</script>
<script>
/*__JS__*/
</script>
</body>
</html>
